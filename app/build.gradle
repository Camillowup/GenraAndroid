plugins {
    id 'com.android.application'
}

android {
    namespace 'ch.camillowup.genrabox'
    compileSdk 34

    defaultConfig {
        applicationId 'ch.camillowup.genrabox'
        minSdk 26          // AAudio
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    // One fixed key in the repo: every build installs over the one before (a sideloaded hobby app, not the Play Store).
    signingConfigs {
        box {
            storeFile file('genrabox.keystore')
            storePassword 'genrabox'
            keyAlias 'genrabox'
            keyPassword 'genrabox'
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.box
        }
        debug {
            signingConfig signingConfigs.box
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}
