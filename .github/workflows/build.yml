# GENRA BOX for Android: builds the APK on every push to main (and by hand). No release: the APK is an artifact.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/GenraBox-$(date +%Y%m%d)-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GenraBox-APK
          path: out/*.apk
          retention-days: 30
